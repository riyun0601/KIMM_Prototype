[build]
  command = "node scripts/build-all.mjs"
  publish = "dist"

[[redirects]]
  from = "/cad/*"
  to = "/cad/index.html"
  status = 200

[[redirects]]
  from = "/cam/*"
  to = "/cam/index.html"
  status = 200

[[redirects]]
  from = "/flow/*"
  to = "/flow/index.html"
  status = 200

[[redirects]]
  from = "/structure/*"
  to = "/structure/index.html"
  status = 200

[[redirects]]
  from = "/sys/*"
  to = "/sys/index.html"
  status = 200

[[headers]]
  for = "/manuals/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
